[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostchat"
version = "0.1.0"
description = "Research-grade prototype of a small-group end-to-end encrypted messenger."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "GhostChat Prototype" }
]
dependencies = [
    "pynacl>=1.5.0",
    "cryptography>=42.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "black>=24.1.0",
    "ruff>=0.5.0",
    "hypothesis>=6.98.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]

